<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111014">
  <title>My Complaints | CampFixr</title>
  <link rel="stylesheet" href="my-complaints.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="dashboard.html" aria-label="Back to dashboard"><img class="brand-mark" src="campfixr-logo.svg" alt=""> <span>CampFixr</span></a>
      <a class="back-link" href="dashboard.html">← Dashboard</a>
    </header>

    <section class="page-heading">
      <p class="eyebrow">STUDENT PORTAL</p>
      <h1>My Complaints</h1>
      <p>View your submitted complaints and their latest status here.</p>
      <span id="account-name" class="account-name"></span>
    </section>

    <section class="complaint-panel" aria-labelledby="list-title">
      <div class="panel-heading">
        <div><h2 id="list-title">Your submitted complaints</h2><p id="list-summary">Loading your complaints…</p></div>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div id="complaint-list" class="complaint-list" aria-live="polite"></div>
    </section>
    <footer>© <span id="year"></span> CampFixr · Student Support Portal</footer>
  </main>
  <script src="my-complaints.js"></script>
</body>
</html>
